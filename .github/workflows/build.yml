name: Build .nro

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  repository_dispatch:
    types: [build]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make clean
          make -j$(nproc)

      - name: Upload .nro
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-nro
          path: pctltcp-nro.nro
          retention-days: 30

      - name: Create release zip
        run: |
          mkdir -p release
          cp pctltcp-nro.nro release/
          cp -r client/ release/
          cd release && zip -r ../pctltcp-nro.zip pctltcp-nro.nro client/

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: pctltcp-nro-release
          path: pctltcp-nro.zip
          retention-days: 30
